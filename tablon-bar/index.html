<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Tablón de pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Tablón de pedidos del bar · una pantalla para la barra o la cocina: los pedidos de hoy en orden, con su hora aproximada */
:root{ color-scheme:light;
  --fondo:#ffffff; --tarjeta:#ffffff; --tinta:#23201c; --tenue:#7a7066; --linea:#e2d9cf;
  --tomate:#d9432f; --tomate-suave:#fdeae7; --mostaza:#e7a400; --mostaza-suave:#fff4d6;
  --oliva:#2f9e5a; --oliva-suave:#e1f5e8; --azul:#2d6cdf; --azul-suave:#e5edfb;
  --f-titulo:'Fredoka',system-ui,sans-serif; --f-texto:'Nunito',system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--tinta);font:17px/1.45 var(--f-texto)}
.cab{background:linear-gradient(135deg,var(--tomate),#f0763d);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cab h1{font:600 26px/1.1 var(--f-titulo);margin:0}
.cab p{margin:4px 0 0;opacity:.92;font-weight:700}
.cab .reloj{font:600 30px/1 var(--f-titulo);font-variant-numeric:tabular-nums}
main{padding:14px 16px 40px;max-width:760px;margin:0 auto}
.resumen{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.pill{border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;background:var(--mostaza-suave);color:#7a5600}
.pill.ok{background:var(--oliva-suave);color:#1d6b3b}
.col h2{font:600 20px var(--f-titulo);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.col h2 .n{background:var(--tinta);color:#fff;border-radius:999px;font:800 13px/1 var(--f-texto);padding:5px 9px}
.lista{display:grid;gap:10px}
.pedido{background:var(--tarjeta);border:2px solid var(--linea);border-radius:18px;padding:12px 14px;display:grid;gap:8px}
.pedido .fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.pedido .quien{font-weight:800;font-size:19px}
.pedido .tel{color:var(--tenue);font-weight:700;font-size:14px}
.pedido .aprox{font:600 24px/1 var(--f-titulo);color:var(--tomate);font-variant-numeric:tabular-nums}
.pedido .aprox small{display:block;font:700 12px var(--f-texto);color:var(--tenue);margin-top:3px;text-align:right}
.pedido .que{font-size:17px;font-weight:700;line-height:1.35}
.pedido .modo{display:inline-block;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;background:var(--azul-suave);color:var(--azul)}
.pedido .modo.dom{background:var(--mostaza-suave);color:#7a5600}
.pedido .dir{color:var(--tenue);font-weight:700;font-size:14px}
.pedido .notas{color:#7a5600;font-weight:700;font-size:14px}
.pedido .est{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{border:2px solid var(--linea);background:#fff;color:var(--tinta);border-radius:12px;font:800 15px var(--f-texto);padding:9px 14px;cursor:pointer;min-height:44px}
.btn.marcha{background:var(--mostaza-suave);border-color:var(--mostaza);color:#7a5600}
.btn.listo{background:var(--oliva-suave);border-color:var(--oliva);color:#1d6b3b}
.pedido .sello{font-weight:800;font-size:14px;padding:9px 4px;flex:1;min-width:110px}
.btn.fin{background:var(--azul-suave);border-color:var(--azul);color:var(--azul)}
.pedido.en_marcha{border-color:var(--mostaza)}
.pedido.listo{border-color:var(--oliva);background:var(--oliva-suave)}
.pedido.entregado{opacity:.5;border-style:dashed}
.pedido.nuevo{animation:late 1s ease-in-out 3}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(217,67,47,0)}50%{box-shadow:0 0 0 8px rgba(217,67,47,.35)}}
.vacio{border:2px dashed var(--linea);border-radius:18px;padding:26px;text-align:center;color:var(--tenue);font-weight:700}
.vacio b{display:block;font:600 22px var(--f-titulo);color:var(--tinta);margin-bottom:4px}
.estado{font-size:13px;color:var(--tenue);font-weight:700;text-align:center;margin:18px 0 0}
.estado.err{color:#b4231f}
.sonido{position:fixed;right:14px;bottom:14px;border-radius:999px;padding:10px 16px;font-weight:800;background:var(--tinta);color:#fff;border:0;font-size:14px}
</style>
</head>
<body>
<header class="cab">
  <div><h1>Tablón de pedidos</h1><p id="fecha"></p></div>
  <div class="reloj" id="reloj">--:--</div>
</header>
<main>
  <div class="resumen"><span class="pill" id="pPend">0 por hacer</span><span class="pill ok" id="pListos">0 listos</span></div>
  <section class="col"><h2>Pedidos de hoy, en orden <span class="n" id="nTodos">0</span></h2><div class="lista" id="lTodos"></div></section>
  <p class="estado" id="estado">Cargando…</p>
</main>
<button class="sonido" id="sonido" type="button">🔔 Activar sonido</button>
<script>
  const FUENTE = 'https://hook.eu1.make.com/dy04ycyacn2qj7uk191n4bvoswf75k73?tipo=tablon';
  const ESTADOS = FUENTE.replace('tipo=tablon','tipo=estados_bar');
  const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const $ = id => document.getElementById(id);
  let pedidos = [], estados = {}, vistos = new Set(JSON.parse(localStorage.getItem('pedidos_vistos')||'[]')), sonidoOn = false;

  function reloj(){ const d=new Date(); $('reloj').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    $('fecha').textContent=DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]; }
  function clave(p){ return p.hora+'|'+p.nombre; }
  // Línea: HH:MM|nombre|telefono|modo|direccion|pedido|hora_aprox|notas|pendiente
  function parsear(t){ const out=[]; t.split(/\r?\n/).forEach(l=>{ const p=l.trim().split('|'); if(p.length>=7 && /^\d{1,2}:\d{2}$/.test(p[0]))
      out.push({hora:p[0].padStart(5,'0'),nombre:p[1],tel:p[2],modo:p[3],dir:p[4],que:p[5],aprox:p[6],notas:p[7]||''}); }); return out; }
  function parsearEstados(t){ const m={}; t.split(/\r?\n/).forEach(l=>{ const p=l.trim().split('|'); if(p.length>=3) m[p[0].padStart(5,'0')+'|'+p[1]]=p[2]; }); return m; }

  function beep(){ if(!sonidoOn) return; try{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); const o=ctx.createOscillator(); const g=ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.value=.25; o.start(); setTimeout(()=>{o.frequency.value=660},180); setTimeout(()=>{o.stop(); ctx.close()},420); }catch(e){} }

  async function marcar(p, est, boton){
    const k=clave(p); const antes=estados[k]; estados[k]=est; pintar();
    try{ const u=new URL(FUENTE); u.searchParams.set('tipo','estado_bar'); u.searchParams.set('hora',p.hora); u.searchParams.set('nombre',p.nombre); u.searchParams.set('estado',est);
      const r=await fetch(u,{cache:'no-store'}); const tx=(await r.text()).trim(); if(!r.ok||tx!=='ok') throw new Error(tx); }
    catch(e){ estados[k]=antes; pintar(); $('estado').textContent='No se pudo guardar el estado. Inténtalo otra vez.'; $('estado').className='estado err'; }
  }
  function boton(txt, cls, p, est){ const b=document.createElement('button'); b.type='button'; b.className='btn '+cls; b.textContent=txt; b.addEventListener('click',()=>marcar(p,est,b)); return b; }

  function tarjeta(p){
    const e=estados[clave(p)]||'pendiente';
    const d=document.createElement('article'); d.className='pedido '+e; if(!vistos.has(clave(p))) d.classList.add('nuevo');
    const f1=document.createElement('div'); f1.className='fila';
    const q=document.createElement('div'); q.innerHTML='<div class="quien"></div><div class="tel"></div>'; q.querySelector('.quien').textContent=p.nombre; q.querySelector('.tel').textContent=(p.tel?'📞 '+p.tel+' · ':'')+'pedido a las '+p.hora;
    const a=document.createElement('div'); a.className='aprox'; a.textContent=p.aprox; const s=document.createElement('small'); s.textContent=p.modo==='domicilio'?'entregar sobre las':'recoger sobre las'; a.prepend(s);
    f1.append(q,a); d.append(f1);
    const que=document.createElement('div'); que.className='que'; que.textContent=p.que; d.append(que);
    const f2=document.createElement('div'); f2.className='fila'; const m=document.createElement('span'); m.className='modo'+(p.modo==='domicilio'?' dom':''); m.textContent=p.modo==='domicilio'?'🛵 A domicilio':'🥡 Para recoger'; f2.append(m);
    if(p.dir){ const dr=document.createElement('span'); dr.className='dir'; dr.textContent='📍 '+p.dir; f2.append(dr); } d.append(f2);
    if(p.notas){ const n=document.createElement('div'); n.className='notas'; n.textContent='📝 '+p.notas; d.append(n); }
    const z=document.createElement('div'); z.className='est';
    const sello=document.createElement('span'); sello.className='sello'; sello.textContent={pendiente:'⏳ Pendiente',en_marcha:'🍳 En marcha',listo:'✅ Listo',entregado:'✔ Entregado'}[e]; z.append(sello);
    if(e==='pendiente'){ z.append(boton('🍳 En marcha','marcha',p,'en_marcha'), boton('✓ Listo','listo',p,'listo')); }
    else if(e==='en_marcha'){ z.append(boton('✓ Listo','listo',p,'listo'), boton('Deshacer','',p,'pendiente')); }
    else if(e==='listo'){ z.append(boton(p.modo==='domicilio'?'🛵 Ha salido':'🙋 Recogido','fin',p,'entregado'), boton('Deshacer','',p,'pendiente')); }
    else { z.append(boton('Deshacer','',p,'listo')); }
    d.append(z); return d;
  }
  function pintarLista(cont, lista, vacioT, vacioS){ cont.replaceChildren(); if(!lista.length){ const v=document.createElement('div'); v.className='vacio'; v.innerHTML='<b></b><span></span>'; v.querySelector('b').textContent=vacioT; v.querySelector('span').textContent=vacioS; cont.append(v); return; } lista.forEach(p=>cont.append(tarjeta(p))); }
  function pintar(){
    const est=p=>estados[clave(p)]||'pendiente';
    const pend=pedidos.filter(p=>['pendiente','en_marcha'].includes(est(p))).sort((a,b)=>a.aprox.localeCompare(b.aprox));
    const listos=pedidos.filter(p=>est(p)==='listo'); const fin=pedidos.filter(p=>est(p)==='entregado');
    const orden=[...pend, ...listos.sort((a,b)=>a.aprox.localeCompare(b.aprox)), ...fin.sort((a,b)=>a.aprox.localeCompare(b.aprox))];
    pintarLista($('lTodos'),orden,'Nada pendiente','Cuando Alba coja un pedido, aparece aquí con su hora.');
    $('nTodos').textContent=pedidos.length;
    $('pPend').textContent=pend.length+' por hacer'; $('pListos').textContent=listos.length+' listos';
  }
  async function cargar(){
    try{
      const [r1,r2]=await Promise.all([fetch(FUENTE,{cache:'no-store'}),fetch(ESTADOS,{cache:'no-store'})]);
      if(!r1.ok) throw new Error('tablón '+r1.status);
      const t1=await r1.text(); const t2=r2.ok?await r2.text():'';
      if(/^Accepted/i.test(t1.trim())) throw new Error('Make no ha respondido');
      pedidos=parsear(t1); estados=parsearEstados(t2);
      const nuevos=pedidos.filter(p=>!vistos.has(clave(p)));
      pintar();
      if(nuevos.length && vistos.size){ beep(); }
      nuevos.forEach(p=>vistos.add(clave(p))); if(!vistos.size && pedidos.length) pedidos.forEach(p=>vistos.add(clave(p)));
      localStorage.setItem('pedidos_vistos',JSON.stringify([...vistos].slice(-300)));
      $('estado').textContent='Actualizado a las '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · se refresca solo cada 30 s'; $('estado').className='estado';
    }catch(e){ $('estado').textContent='No se pudo cargar el tablón ('+e.message+'). Reintento en 30 s.'; $('estado').className='estado err'; }
  }
  $('sonido').addEventListener('click',()=>{ sonidoOn=!sonidoOn; $('sonido').textContent=sonidoOn?'🔔 Sonido activado':'🔕 Sonido apagado'; if(sonidoOn) beep(); });
  reloj(); setInterval(reloj,15000); cargar(); setInterval(cargar,30000);
</script>
</body>
</html>
